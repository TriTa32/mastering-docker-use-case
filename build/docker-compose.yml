version: '3.8'

services:
  # ---------------------------
  # API Gateway
  # ---------------------------
  api-gateway:
    build: 
      context: ../application/api-gateway/
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    networks:
      - build_backend
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  # ---------------------------
  # Service One
  # ---------------------------
  service-one:
    build: 
      context: ../application/service-one/
      dockerfile: Dockerfile
    ports:
      - 8082:8082
    networks:
      - build_backend
    container_name: service-one
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  # ---------------------------
  # Service Two
  # ---------------------------
  service-two:
    build: 
      context: ../application/service-two/
      dockerfile: Dockerfile
    ports:
      - 8084:8084
    networks:
      - build_backend
    container_name: service-two
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  # ---------------------------
  # Other services (DBs, etc.)
  # ---------------------------
  service-one-db:
    image: mongo:3.7
    ports:
      - 27017:27017
    networks:
      - build_backend
    container_name: service-one-db
    environment:
      - MONGODB_USER=service-one
      - MONGODB_PASS=service-one
      - MONGO_DATA_DIR=/data/db
    volumes:
      - build_mongodata:/data/db

  service-two-db:
    image: mysql/mysql-server:latest
    ports:
      - 3310:3306
    networks:
      - build_backend
    container_name: service-two-db
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=service-two
      - MYSQL_USER=service-two
      - MYSQL_PASSWORD=service-two

  # Additional services (RabbitMQ, Consul, etc.) as needed...

networks:
  build_backend:
    driver: bridge

volumes:
  build_mongodata:
  maven_cache:
  dist:
